<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Price Check · ราคาสารเคมีเกษตร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2a22;--mute:#5f6b63;--faint:#8c968f;--line:#e2e6e1;--bg:#f6f7f4;--card:#fff;--acc:#2f6b3f;--acc-bg:#e7f0e8;--acc-ink:#1f4a2b;--warn-bg:#fdf3df;--warn:#7a5310;--r:10px}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans Thai",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5}
button,select,input{font:inherit;color:inherit}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
header h1{font-size:18px;font-weight:600;margin:0;margin-right:auto}
header h1 span{color:var(--mute);font-weight:400;font-size:14px;margin-left:6px}
.meta{font-size:12px;color:var(--faint)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#c4cbc4}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover{background:#285c36}
select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--card)}
.tabs{display:flex;gap:4px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--line)}
.tab{padding:10px 14px;border:none;background:none;cursor:pointer;color:var(--mute);border-bottom:2px solid transparent}
.tab.on{color:var(--acc-ink);border-bottom-color:var(--acc);font-weight:500}
main{padding:16px 20px 90px;max-width:1400px;margin:0 auto}
.lbl{font-size:12px;color:var(--mute);margin:14px 0 6px;font-weight:500}
.lbl em{font-style:normal;color:var(--faint);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px;color:var(--mute)}
.chip:hover{border-color:#c4cbc4}
.chip.on{background:var(--acc-bg);border-color:#b9d3bf;color:var(--acc-ink);font-weight:500}
.chip small{color:var(--faint);margin-left:4px}
.chip.on small{color:var(--acc)}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;margin-top:6px}
@media (max-width:860px){.layout{grid-template-columns:1fr}.pests{max-height:240px}}
.pestrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.pestsel{min-width:320px;max-width:100%;padding:8px 10px;font-size:15px}
.pests{display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 160px);position:sticky;top:10px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px}
.pest{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:7px;cursor:pointer;border:none;background:none;text-align:left}
.pest:hover{background:var(--bg)}
.pest.on{background:var(--acc-bg);color:var(--acc-ink)}
.pest .en{display:block;font-size:12px;color:var(--faint)}
.pest .n{font-size:12px;color:var(--faint);align-self:center}
.pest.on .n{color:var(--acc)}
.pest.empty{opacity:.55}
.note{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;margin:8px 0}
.info{background:var(--bg);color:var(--mute);border:1px dashed var(--line);border-radius:8px;padding:14px;font-size:13px}
.ptitle{font-size:17px;font-weight:600;margin:0}
.psub{color:var(--mute);font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 8px}
.bar .count{color:var(--mute);font-size:13px;margin-right:auto}
.tog{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mute);cursor:pointer}
.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th{font-size:12px;font-weight:500;color:var(--mute);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);background:#fafbf9;position:sticky;top:0;cursor:pointer;user-select:none;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
tr.sel td{background:#f3f8f3}
td.num,th.num{text-align:right;white-space:nowrap}
.tn{font-weight:500}
.sub{font-size:12px;color:var(--faint)}
.price{font-size:15px;font-weight:600}
.np{color:var(--faint);font-size:12px}
.cost{font-size:12px;color:var(--faint);white-space:nowrap}
.moa{font-size:12px;background:var(--bg);border-radius:5px;padding:1px 6px;white-space:nowrap;color:var(--mute)}
.grp td{background:#fafbf9;font-size:12px;color:var(--mute);font-weight:500;padding:6px 10px}
input[type=checkbox]{accent-color:var(--acc);width:16px;height:16px;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:none;background:none;padding:5px 12px;cursor:pointer;color:var(--mute)}
.seg button.on{background:var(--acc);color:#fff}
.lo{color:#1f7a3a}.hi{color:#b0452c}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0 4px}
.sumc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.search{width:100%;max-width:520px;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--card)}
.foot{font-size:12px;color:var(--faint);margin-top:10px}
.action{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:5}
.action .s{margin-right:auto;color:var(--mute);font-size:13px}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(20,30,24,.45);display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:20}
.modal.show{display:flex}
.modal .box{background:#fff;border-radius:12px;max-width:900px;width:100%;padding:16px}
.modal .tools{display:flex;gap:8px;justify-content:flex-end;margin-bottom:10px;flex-wrap:wrap}
#sheet{border:1px solid var(--line);border-radius:8px;padding:24px}
/* print sheet */
.ps{font-family:"IBM Plex Sans Thai",system-ui,sans-serif;color:#111;font-size:12px}
.ps h2{font-size:20px;margin:0}
.ps .h{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #2f6b3f;padding-bottom:8px;margin-bottom:10px}
.ps .h .r{text-align:right;font-size:11px;color:#555}
.ps .k{font-size:13px;margin:2px 0;color:#333}
.ps .nt{background:#fdf3df;padding:6px 10px;border-radius:6px;margin:8px 0;font-size:11px}
.ps table{min-width:0;width:100%;border-collapse:collapse;margin-top:6px}
.ps th{position:static;background:#eef3ee;color:#222;font-size:11px;border:1px solid #cfd8cf;cursor:default}
.ps td{border:1px solid #dfe5df;font-size:12px;padding:5px 8px}
.ps .g td{background:#f5f8f5;font-weight:600;font-size:11px}
.ps .pr{text-align:right;font-weight:600;white-space:nowrap}
.ps .f{margin-top:10px;font-size:10px;color:#777}
@media print{
  body{background:#fff}
  header,.tabs,main,.action,.toast,.modal .tools{display:none!important}
  .modal{position:static;display:block!important;padding:0;background:none}
  .modal .box{padding:0;max-width:none}
  #sheet{border:none;padding:0}
  @page{size:A4;margin:12mm}
  tr{page-break-inside:avoid}
}
</style>
</head>
<body>
<header>
  <h1>Price Check<span>ราคาสารเคมีเกษตร · farmer price</span></h1>
  <label class="meta">ภาค / Region
    <select id="region">
      <option value="any">ทุกภาค (ล่าสุด)</option>
      <option value="central">ภาคกลาง Central</option>
      <option value="east" selected>ภาคตะวันออก East</option>
      <option value="west">ภาคตะวันตก West</option>
      <option value="northeast">ภาคอีสาน Northeast</option>
      <option value="south">ภาคใต้ South</option>
    </select>
  </label>
  <label class="btn" title="Load a newer price_pesticide.xlsx">Load Excel<input id="file" type="file" accept=".xlsx" hidden></label>
  <span class="meta" id="src"></span>
</header>
<nav class="tabs">
  <button class="tab on" data-tab="pest">ค้นหาตามพืช / ศัตรูพืช</button>
  <button class="tab" data-tab="chem">เทียบราคาตามสาร</button>
  <button class="tab" data-tab="search">ค้นหาสินค้า</button>
</nav>
<main>
  <section id="tab-pest">
    <div class="lbl">1 · พืช Crop</div>
    <div class="chips" id="crops"></div>
    <div class="lbl">2 · ประเภทศัตรูพืช Pest type</div>
    <div class="chips" id="ptypes"></div>
    <div class="pestrow"><select id="pestSel" class="pestsel"></select><span class="meta" id="pestHint"></span></div>
    <div id="pestResult"></div>
  </section>
  <section id="tab-chem" hidden>
    <div class="lbl">เลือกสารสำคัญ Active ingredient <em>· พิมพ์เพื่อค้นหา</em></div>
    <input class="search" id="chemQ" list="chemList" placeholder="imidacloprid" autocomplete="off">
    <datalist id="chemList"></datalist>
    <div class="chips" id="chemTop" style="margin-top:8px"></div>
    <div id="chemResult"></div>
  </section>
  <section id="tab-search" hidden>
    <div class="lbl">ค้นหา ชื่อการค้า / สารสำคัญ / บริษัท</div>
    <input class="search" id="q" placeholder="ซานโตส, imidacloprid, Sotus" autocomplete="off">
    <div class="lbl">ประเภท Category</div>
    <div class="chips" id="cats"></div>
    <div id="searchResult"></div>
  </section>
</main>
<div class="action">
  <span class="s" id="selInfo">ติ๊กเลือกสินค้าเพื่อพิมพ์ · nothing selected = print the whole list</span>
  <button class="btn" id="clearSel">Clear</button>
  <button class="btn" id="copyBtn">Copy table</button>
  <button class="btn primary" id="printBtn">Print sheet</button>
</div>
<div class="modal" id="modal"><div class="box">
  <div class="tools">
    <span class="meta" id="printHint" style="margin-right:auto;align-self:center"></span>
    <button class="btn" id="closeModal">Close</button>
    <button class="btn primary" id="doPrint">Print</button>
  </div>
  <div id="sheet"></div>
</div></div>
<div class="toast" id="toast"></div>

// ---------- build normalized database from raw records ----------
function build(raw){
  const prods=raw.products.map((r,i)=>({...r,i}));
  const canon={},cnt={};
  prods.forEach(p=>{p.company=(p.company==null?"–":String(p.company).trim());const k=p.company.toLowerCase();cnt[k]=cnt[k]||{};cnt[k][p.company]=(cnt[k][p.company]||0)+1});
  for(const k in cnt)canon[k]=Object.entries(cnt[k]).sort((a,b)=>b[1]-a[1])[0][0];
  prods.forEach(p=>{
    p.company=canon[p.company.toLowerCase()];
    p.trade_name=String(p.trade_name).trim();
    p.formulation_type=(p.formulation_type?String(p.formulation_type):"").trim().toUpperCase();
    p.common_name=p.common_name?String(p.common_name).trim():"";
    p.concentration=fmtConc(p.concentration);
    ["year","size","min_usage","max_usage"].forEach(c=>p[c]=num(p[c]));
    REGIONS.forEach(r=>p[r]=num(p[r+"_farmer_price"]));
    p.ais=splitAI(p.common_name);
    p.scheme=CAT_SCHEME[p.category]||"";
    const m=raw.aiCode[p.scheme]||{};
    p.codes=[...new Set(p.ais.map(a=>m[a]).filter(Boolean))];
    p.pack=pack(p.size,p.formulation_type);
    p.basis=(p.category==="Herbicide"||PER_RAI.has(p.formulation_type))?"ต่อไร่":"ต่อ 200 L";
    p.key=[p.company,p.trade_name,p.size,p.formulation_type].join("|");
  });
  const pests=raw.pests.map(p=>({...p,crops:splitList(p.major_crops),ai_list:splitList(p.active_ingredients).map(a=>a.toLowerCase()),notes:p.notes||""}));
  const allAI=new Set(prods.flatMap(p=>p.ais));
  return {prods,pests,aiCode:raw.aiCode,groupInfo:raw.groupInfo,allAI};
}

// one row per product (company+name+pack+form): latest row as master, latest price in region
function makeView(region){
  const byKey=new Map();
  DB.prods.forEach(p=>{if(!byKey.has(p.key))byKey.set(p.key,[]);byKey.get(p.key).push(p)});
  const out=[];
  for(const [key,rows] of byKey){
    rows.sort((a,b)=>(a.year??0)-(b.year??0)||a.i-b.i);
    const m=rows[rows.length-1];
    let price=null,year=null,reg=null;const rp={},ry={};
    for(const r of rows){for(const g of REGIONS){if(r[g]!=null){rp[g]=r[g];ry[g]=r.year}}
      const regs=region==="any"?REGIONS:[region];for(const g of regs){if(r[g]!=null){price=r[g];year=r.year;reg=g}}}
    const o={...m,price,pyear:year,preg:reg,rp,ry};
    const vals=Object.values(rp);o.rmin=vals.length?Math.min(...vals):null;o.rmax=vals.length?Math.max(...vals):null;o.rn=vals.length;
    o.unit=price!=null&&m.size?price/m.size:null;
    o.c1=price!=null&&m.size&&m.min_usage!=null?price*m.min_usage/m.size:null;
    o.c2=price!=null&&m.size&&m.max_usage!=null?price*m.max_usage/m.size:null;
    out.push(o);
  }
  return out;
}
function costText(r){let a=r.c1,b=r.c2;if(a==null&&b==null)return"";if(a==null)a=b;if(b==null||Math.round(a)===Math.round(b))return`${baht(a)} ${r.basis}`;return`${baht(a)}–${baht(b)} ${r.basis}`}

// ---------- Excel loader (SheetJS) ----------
function readXlsx(buf){
  const wb=XLSX.read(buf,{type:"array"});
  const rowsOf=name=>{const ws=wb.Sheets[name];return ws?XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null}):null};
  const headerAt=(rows,key)=>rows.findIndex(r=>r&&r.some(v=>String(v??"").trim()===key));
  const products=[];
  CATS.forEach(cat=>{
    const rows=rowsOf(cat);if(!rows)return;
    const h=headerAt(rows,"trade_name");if(h<0)return;
    const hd=rows[h].map(v=>String(v??"").trim());
    for(let i=h+1;i<rows.length;i++){
      const r=rows[i];const o={category:cat};hd.forEach((c,j)=>{if(c)o[c]=r[j]});
      if(o.trade_name==null||String(o.trade_name).trim()==="")continue;
      products.push(o);
    }
  });
  if(!products.length)throw new Error("No product sheets found");
  const aiCode={},groupInfo={};
  [["IRAC","irac_code"],["FRAC","frac_code"],["HRAC","hrac_code"]].forEach(([s,col])=>{
    aiCode[s]={};groupInfo[s]={};
    const rows=rowsOf(s);if(!rows)return;
    const h=headerAt(rows,"ingredient");if(h<0)return;
    const hd=rows[h].map(v=>String(v??"").trim());
    const gi=hd.indexOf(col),gm=hd.indexOf("mode_of_action_en"),ai=hd.indexOf("ingredient"),ac=hd.indexOf(col,ai);
    for(let i=h+1;i<rows.length;i++){const r=rows[i];if(!r)continue;
      if(gi>=0&&r[gi]!=null&&gi<ai)groupInfo[s][String(r[gi]).trim()]=r[gm]??"";
      if(r[ai]!=null&&ac>=0&&r[ac]!=null)aiCode[s][String(r[ai]).trim().toLowerCase()]=String(r[ac]).trim();
    }
  });
  const pr=rowsOf("pest")||rowsOf("insect")||[];
  const ph=headerAt(pr,"pest_id");const pests=[];
  if(ph>=0){const hd=pr[ph].map(v=>String(v??"").trim());
    for(let i=ph+1;i<pr.length;i++){const r=pr[i];if(!r)continue;const o={};hd.forEach((c,j)=>{if(c)o[c]=r[j]});if(o.pest_id)pests.push(o)}}
  return {products,pests,aiCode,groupInfo};
}
$("file").addEventListener("change",async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    if(typeof XLSX==="undefined")throw new Error("Excel reader did not load");
    const raw=readXlsx(new Uint8Array(await f.arrayBuffer()));
    raw.source=f.name;raw.loaded=new Date().toISOString().slice(0,10);
    RAW=raw;init();toast(`Loaded ${raw.products.length} products from ${f.name}`);
  }catch(err){toast("Could not read this file: "+err.message)}
  e.target.value="";
});

let CUR=null;
function sortRows(f){
  const k=S.sort;const r=[...f];
  const nn=(a,b,x)=>(a[x]==null)-(b[x]==null)||(a[x]??0)-(b[x]??0);
  const pk=S.mode==="compare"?"rmin":"price";
  if(k==="price")r.sort((a,b)=>nn(a,b,pk)||a.trade_name.localeCompare(b.trade_name,"th"));
  else if(k==="unit")r.sort((a,b)=>nn(a,b,"unit"));
  else if(k==="company")r.sort((a,b)=>a.company.localeCompare(b.company,"th")||a.trade_name.localeCompare(b.trade_name,"th"));
  else r.sort((a,b)=>a.trade_name.localeCompare(b.trade_name,"th"));
  return r;
}

    ${S.region==="any"?`<td class="sub">${esc(REGION_TH[r.preg]||"")}</td>`:""}
    <td class="sub">${r.pyear??r.year??""}</td>
    <td class="num cost">${esc(costText(r))}</td></tr>`;
  });
  return h+"</tbody></table></div>";
}

function compareHTML(rows,o){
  const regs=activeRegions(rows);const empty=REGIONS.filter(g=>!regs.includes(g));
  const all=rows.every(r=>S.sel.has(r.key));
  let h=`<div class="tablewrap"><table><thead><tr><th style="width:30px"><input type="checkbox" data-selall${all?" checked":""}></th><th>สินค้า Product</th><th>สารสำคัญ</th><th>Pack</th>${regs.map(g=>`<th class="num">${esc(REGION_TH[g])}</th>`).join("")}<th class="num">ต่าง (฿)</th>${S.perUnit?'<th class="num">฿/L·kg ต่ำสุด</th>':""}<th>MoA</th></tr></thead><tbody>`;
  rows.forEach(r=>{const codes=o.moaKey?r[o.moaKey]:r.codes;const sch=o.scheme||r.scheme;const multi=r.rn>1&&r.rmin!==r.rmax;
    h+=`<tr class="${S.sel.has(r.key)?"sel":""}"><td><input type="checkbox" data-key="${esc(r.key)}"${S.sel.has(r.key)?" checked":""}></td>
    <td><div class="tn">${esc(r.trade_name)}</div><div class="sub">${esc(r.company)}</div></td>
    <td>${esc(r.common_name)}<div class="sub">${esc(r.concentration)} ${esc(r.formulation_type)}</div></td><td>${esc(r.pack)}</td>
    ${regs.map(g=>{const v=r.rp[g];if(v==null)return'<td class="num np">–</td>';const c=multi&&v===r.rmin?" lo":multi&&v===r.rmax?" hi":"";return`<td class="num"><span class="price${c}">${baht(v)}</span><div class="sub">${r.ry[g]??""}</div></td>`}).join("")}
    <td class="num sub">${multi?baht(r.rmax-r.rmin):""}</td>
    ${S.perUnit?`<td class="num">${r.rmin!=null&&r.size?baht(r.rmin/r.size):""}</td>`:""}
    <td>${codes&&codes.length?`<span class="moa">${esc(sch)} ${esc(codes.join("+"))}</span>`:""}</td></tr>`});
  h+="</tbody></table></div>";
  if(empty.length)h+=`<div class="foot">ยังไม่มีราคา: ${esc(empty.map(g=>REGION_TH[g]).join(", "))} · <span class="lo">ต่ำสุด</span> / <span class="hi">สูงสุด</span> ระหว่างภาค</div>`;
  return h;
}

// ---------- selection, copy, print ----------
function chosen(){if(!CUR)return[];const s=CUR.rows.filter(r=>S.sel.has(r.key));return s.length?s:CUR.rows}
function updateSel(){
  const n=CUR?CUR.rows.filter(r=>S.sel.has(r.key)).length:0;
  $("selInfo").textContent=n?`เลือก ${n} รายการ — will print only these`:`ติ๊กเลือกสินค้าเพื่อพิมพ์ · nothing selected = print all ${CUR?CUR.rows.length:0}`;
}
function tsv(rows){
  if(S.mode==="compare"){const regs=activeRegions(rows);
    return [["Product","Company","Active ingredient","Conc.","Form","Pack",...regs.map(g=>g+" price"),"MoA"],...rows.map(r=>[r.trade_name,r.company,r.common_name,r.concentration,r.formulation_type,r.pack,...regs.map(g=>r.rp[g]??""),(r.mc||r.codes||[]).join("+")])].map(a=>a.join("\t")).join("\n")}
  const head=["Product","Company","Active ingredient","Conc.","Form","Pack","Farmer price (THB)","MoA","Year"];
  return [head,...rows.map(r=>[r.trade_name,r.company,r.common_name,r.concentration,r.formulation_type,r.pack,r.price??"",(r.mc||r.codes||[]).join("+"),r.pyear??r.year??""])].map(a=>a.join("\t")).join("\n");
}
$("copyBtn").onclick=async()=>{const rows=chosen();if(!rows.length)return toast("Nothing to copy");
  try{await navigator.clipboard.writeText(tsv(rows));toast(`Copied ${rows.length} rows · paste into Excel`)}catch(e){toast("Copy was blocked by the browser")}};
$("clearSel").onclick=()=>{S.sel.clear();render()};

function sheetHTML(){
  const rows=chosen();const d=new Date();
  const date=d.toLocaleDateString("th-TH",{year:"numeric",month:"long",day:"numeric"});
  let h=`<div class="ps"><div class="h"><div><h2>${esc(CUR.title)}</h2>`;
  if(CUR.crop)h+=`<div class="k">พืช: ${esc(CROP_TH[CUR.crop]||"")} ${esc(CUR.crop)}</div>`;
  if(CUR.filters.length)h+=`<div class="k">ตัวกรอง: ${esc(CUR.filters.join(" · "))}</div>`;
  const cmp=S.mode==="compare",regs=cmp?activeRegions(rows):[];
  h+=`</div><div class="r">ราคาเกษตรกร · ${cmp?"เทียบทุกภาค":esc(REGION_TH[S.region])}<br>พิมพ์ ${esc(date)}<br>${rows.length} รายการ</div></div>`;
  if(CUR.pest&&CUR.pest.notes)h+=`<div class="nt">⚠ ${esc(CUR.pest.notes)}</div>`;
  h+=`<table><thead><tr><th style="width:28px">#</th><th>ชื่อการค้า</th><th>บริษัท</th><th>สารสำคัญ</th><th>สูตร</th><th>ขนาด</th>${cmp?regs.map(g=>`<th style="text-align:right">${esc(REGION_TH[g])}</th>`).join(""):'<th style="text-align:right">ราคา (฿)</th>'}</tr></thead><tbody>`;const nc=6+(cmp?regs.length:1);
  const groups={};rows.forEach(r=>{const g=CUR.groupBy(r)||"–";(groups[g]=groups[g]||[]).push(r)});
  let i=0;
  Object.keys(groups).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).forEach(g=>{
    if(Object.keys(groups).length>1)h+=`<tr class="g"><td colspan="${nc}">${esc(CUR.groupName(g))}</td></tr>`;
    groups[g].forEach(r=>{i++;h+=`<tr><td>${i}</td><td><b>${esc(r.trade_name)}</b></td><td>${esc(r.company)}</td><td>${esc(r.common_name)}</td><td>${esc(r.concentration)} ${esc(r.formulation_type)}</td><td>${esc(r.pack)}</td>${cmp?regs.map(g=>`<td class="pr">${r.rp[g]!=null?baht(r.rp[g]):"–"}</td>`).join(""):`<td class="pr">${r.price!=null?baht(r.price):"–"}</td>`}</tr>`});
  });
  h+=`</tbody></table><div class="f">ราคาเกษตรกรจากการสำรวจตลาด · ข้อมูล: ${esc(RAW.source||"")} (${esc(RAW.loaded||"")}) · ใช้ภายในเท่านั้น</div></div>`;
  return h;
}
let DL=null;
(async()=>{try{if(window.claude&&claude.use)DL=await claude.use("downloads")}catch(e){DL=null}})();
$("printBtn").onclick=()=>{if(!CUR||!CUR.rows.length)return toast("Nothing to print");$("sheet").innerHTML=sheetHTML();
  $("printHint").textContent=DL?"Inside Claude, Print saves an A4 file — open it and press Ctrl+P":"A4 · choose your printer or Save as PDF";$("modal").classList.add("show")};
$("closeModal").onclick=()=>$("modal").classList.remove("show");
$("doPrint").onclick=async()=>{
  if(DL){
    const css=[...document.querySelectorAll("style")].map(s=>s.textContent).join("\n");
    const doc=`<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><title>${esc(CUR.title)}</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet"><style>${css} body{background:#fff;padding:20px}</style></head><body>${$("sheet").innerHTML}<script>window.onload=()=>setTimeout(()=>print(),400)<\/script></body></html>`;
    try{await DL.save({filename:`price_${(CUR.title||"list").replace(/[^\p{L}\p{N}]+/gu,"_").slice(0,40)}.html`,data:new Blob([doc],{type:"text/html"})});toast("Saved · open the file to print")}
    catch(e){toast("Save was cancelled")}
  }else window.print();
};

// ---------- events ----------
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-crop],[data-pest],[data-group],[data-ai],[data-cat],[data-chem],[data-mode],[data-showall],[data-ptype],.tab");if(!t)return;
  if(t.dataset.ptype){if(S.ptype!==t.dataset.ptype){S.ptype=t.dataset.ptype;S.pest=null}render();return}
  if(t.dataset.showall!==undefined){S.showAll=true;render();return}
  if(t.dataset.mode){S.mode=t.dataset.mode;render();return}
  if(t.dataset.chem!==undefined){S.chem=t.dataset.chem;$("chemQ").value=S.chem;render();return}
  if(t.dataset.crop){S.crop=t.dataset.crop;S.pest=null;S.ptype=null}
  else if(t.dataset.pest){if(S.pest!==t.dataset.pest){S.pest=t.dataset.pest;S.groups.clear();S.ais.clear()}}
  else if(t.dataset.group){const g=t.dataset.group;S.groups.has(g)?S.groups.delete(g):S.groups.add(g)}
  else if(t.dataset.ai){const a=t.dataset.ai;S.ais.has(a)?S.ais.delete(a):S.ais.add(a)}
  else if(t.dataset.cat){const c=t.dataset.cat;S.cats.has(c)?S.cats.delete(c):S.cats.add(c)}
  else if(t.dataset.tab){S.tab=t.dataset.tab;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b===t));["pest","chem","search"].forEach(x=>$("tab-"+x).hidden=S.tab!==x);if(S.tab==="chem")S.mode="compare"}
  render();
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.key!==undefined){t.checked?S.sel.add(t.dataset.key):S.sel.delete(t.dataset.key);t.closest("tr").classList.toggle("sel",t.checked);
    const all=document.querySelector("[data-selall]");if(all&&CUR)all.checked=CUR.rows.every(r=>S.sel.has(r.key));updateSel();return}
  if(t.dataset.selall!==undefined){CUR.rows.forEach(r=>t.checked?S.sel.add(r.key):S.sel.delete(r.key));render();return}
  if(t.dataset.opt){const k=t.dataset.opt;S[k]=t.type==="checkbox"?t.checked:t.value;if(k==="perUnit"&&!S.perUnit&&S.sort==="unit")S.sort="price";render()}
});
$("region").onchange=e=>{S.region=e.target.value;try{localStorage.setItem("pc_region",S.region)}catch(x){}VIEW=makeView(S.region);render()};
$("pestSel").addEventListener("change",e=>{S.pest=e.target.value;S.groups.clear();S.ais.clear();render()});
$("chemQ").addEventListener("change",e=>{S.chem=e.target.value.trim().toLowerCase();render()});
$("chemQ").addEventListener("keydown",e=>{if(e.key==="Enter"){S.chem=e.target.value.trim().toLowerCase();render()}});
let qt;$("q").addEventListener("input",e=>{clearTimeout(qt);qt=setTimeout(()=>{S.q=e.target.value;render()},150)});

function render(){
  if(S.tab==="pest"){renderCrops();renderPests();renderPestResult()}else if(S.tab==="chem")renderChem();else renderSearch();
}
function init(){
  DB=build(RAW);$("region").value=S.region;VIEW=makeView(S.region);S.sel.clear();
  $("src").textContent=`${RAW.source||""} · ${VIEW.length} products · ${RAW.loaded||""}`;
  render();
}
init();
</script>
</body>
</html>
